server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Encabezados de seguridad. nginx no hereda add_header dentro de un location que
    # define los suyos, por eso se incluyen en cada location.
    include /etc/nginx/snippets/security-headers.conf;

    # Caché para activos estáticos con hash
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, no-transform, immutable" always;
    }

    # index.html sin caché para que cada despliegue llegue de inmediato
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fallback para Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de verificación de estado (Healthcheck de Docker, Umbrel y Coolify)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
